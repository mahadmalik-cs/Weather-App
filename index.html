<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 20px;
        }

        .container{
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        .container h1{
            margin-bottom: 20px;
            color: #1e3c72;
        }

        input{
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus{
            border-color: #2a5298;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            background: #2a5298;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #1e3c72;
        }

        .weather-box{
            margin-top: 25px;
        }

        .weather-box h2{
            color: #333;
            margin-bottom: 10px;
        }

        .weather-box p{
            font-size: 20px;
            color: #555;
            margin-top: 10px;
        }

        @media(max-width: 500px){

            .container{
                padding: 20px;
            }

            .container h1{
                font-size: 24px;
            }

            button{
                font-size: 14px;
            }

        }

    </style>

</head>
<body>

    <div class="container">

        <h1>🌤 Weather App</h1>

        <input type="text" placeholder="Enter city name">

        <button>Get Weather</button>

        <div class="weather-box">

            <h2 id="city"></h2>

            <p id="temp"></p>

            <p id="condition"></p>

        </div>

    </div>

</body>

<script>

    let input = document.querySelector("input")

    let button = document.querySelector("button")

    let cityName = document.getElementById("city")

    let temp = document.getElementById("temp")

    let condition = document.getElementById("condition")


    button.addEventListener("click", ()=>{

        let city = input.value

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=0f1696acb8b1fccdaedad8c0590040bf&units=metric`)

        .then(response => response.json())

        .then(data => {

            console.log(data)

            cityName.innerText = data.name

            temp.innerText = `🌡 Temperature: ${data.main.temp} °C`

            condition.innerText = `☁ Weather: ${data.weather[0].main}`

        })

    })

</script>
</html>
